<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="GDG NTUST 抽獎輪盤" />
    <title>Spin · GDG NTUST</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Before first paint: apply the saved theme, and hide content that the
      // intro / scroll-reveal will animate in (CSS has a failsafe timeout).
      (function (root) {
        try {
          var t = localStorage.getItem('spin:theme');
          if (t === 'light' || t === 'dark') root.dataset.theme = t;
        } catch (e) {}
        var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var played = false;
        try { played = sessionStorage.getItem('spin:intro-played') === '1'; } catch (e) {}
        if (!reduced) root.classList.add('reveal-pending');
        if (!reduced && !played) root.classList.add('intro-pending');
      })(document.documentElement);
    </script>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="./" aria-label="GDG on Campus NTUST 抽獎輪盤首頁">
        <img class="brand-logo brand-logo-light" src="/logo.svg" alt="" width="52" height="52" />
        <img class="brand-logo brand-logo-dark" src="/logo-dark.svg" alt="" width="52" height="52" />
      </a>
      <h1 class="site-title">抽獎輪盤</h1>
      <div class="header-actions">
        <button id="mute-toggle" class="icon-btn" type="button" aria-label="音效"></button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切換深淺色"></button>
      </div>
    </header>

    <main class="layout">
      <section class="panel panel-entries" aria-labelledby="entries-heading">
        <div class="panel-head">
          <h2 id="entries-heading" class="panel-title">名單</h2>
          <span class="count-badge"><span id="entry-count"></span><span class="count-unit">人</span></span>
        </div>

        <label class="field-label" for="entry-input">批次輸入</label>
        <textarea
          id="entry-input"
          class="input textarea"
          rows="5"
          placeholder="貼上名單，可用換行、逗號、頓號、|、Tab 或分號分隔"
          aria-describedby="entry-hint"
        ></textarea>
        <div class="row row-between">
          <button id="entry-add" class="btn btn-primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            加入名單
          </button>
          <span id="entry-hint" class="hint"><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd></span>
        </div>

        <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-describedby="dropzone-hint">
          <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <span class="dropzone-text">拖曳 CSV 到這裡，或<span class="dropzone-link">點選選擇檔案</span></span>
          <span id="dropzone-hint" class="hint">讀取「name / 姓名」欄，沒有則讀第一欄</span>
          <input id="csv-input" type="file" accept=".csv,.txt,.tsv,text/csv,text/plain" hidden />
        </div>

        <div class="row row-between">
          <div class="segmented" role="radiogroup" aria-label="匯入方式">
            <span class="segmented-indicator" aria-hidden="true"></span>
            <label><input type="radio" name="import-mode" value="append" /><span>附加</span></label>
            <label><input type="radio" name="import-mode" value="replace" /><span>取代</span></label>
          </div>
          <label class="switch">
            <input id="opt-dedupe" type="checkbox" role="switch" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span>移除重複</span>
          </label>
        </div>

        <div class="list-toolbar">
          <button id="export-entries" class="btn btn-ghost btn-sm" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4 17v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/></svg>
            匯出名單
          </button>
          <button id="clear-entries" class="btn btn-ghost btn-sm btn-danger" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
            清空
          </button>
        </div>

        <ul id="chip-list" class="chip-list" aria-label="目前名單"></ul>
        <p id="entries-empty" class="empty-state">還沒有人，先貼上名單或匯入 CSV</p>

        <div class="settings">
          <label class="switch">
            <input id="opt-remove-winner" type="checkbox" role="switch" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span>抽中後自動從獎池移除</span>
          </label>
          <div class="range-field">
            <div class="range-head">
              <label for="opt-near-miss">邊界演出機率</label>
              <output id="near-miss-value" for="opt-near-miss"></output>
            </div>
            <input id="opt-near-miss" class="range" type="range" min="0" max="100" step="5" aria-describedby="near-miss-hint" />
            <p id="near-miss-hint" class="hint">停點貼近分界線、在格釘上晃一下的機率。只是視覺演出，不影響抽獎結果。</p>
          </div>
        </div>
      </section>

      <section class="panel panel-wheel" aria-labelledby="wheel-heading">
        <h2 id="wheel-heading" class="visually-hidden">輪盤</h2>
        <div id="wheel-stage" class="wheel-stage">
          <svg class="charge-ring" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="charge-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4285F4" />
                <stop offset=".35" stop-color="#EA4335" />
                <stop offset=".65" stop-color="#FBBC04" />
                <stop offset="1" stop-color="#34A853" />
              </linearGradient>
            </defs>
            <circle class="charge-track" cx="50" cy="50" r="48.6" />
            <circle class="charge-arc" cx="50" cy="50" r="48.6" pathLength="1" />
          </svg>
          <div class="wheel-shadow" aria-hidden="true"></div>
          <canvas class="wheel-canvas" role="img" aria-label="抽獎輪盤"></canvas>
          <div class="wheel-pointer" aria-hidden="true">
            <svg viewBox="0 0 40 52"><path d="M20 50 3.5 14.5A18 18 0 1 1 36.5 14.5Z" /><circle cx="20" cy="17" r="6" /></svg>
          </div>
          <div class="nameplate" hidden aria-hidden="true"><span class="nameplate-text"></span></div>
          <button class="wheel-hub" type="button" aria-label="開始抽獎" aria-describedby="wheel-help">
            <span class="hub-label hub-label-start">開始</span>
            <span class="hub-label hub-label-stop">停下</span>
          </button>
        </div>
        <p id="wheel-help" class="wheel-help">試試甩動輪盤、按住<kbd>空白鍵</kbd>蓄力後放開、轉動中再點一下即可停下</p>

        <div class="draw-controls">
          <label class="switch">
            <input id="opt-fast" type="checkbox" role="switch" aria-describedby="fast-hint" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span>快速模式 <small id="fast-hint" class="hint">第 2 次起約 2 秒</small></span>
          </label>
          <div class="batch-control">
            <div class="stepper">
              <button type="button" class="stepper-btn" data-step="-1" aria-label="減少人數">−</button>
              <input id="batch-count" class="stepper-input" type="number" inputmode="numeric" min="1" value="3" aria-label="批次人數" />
              <button type="button" class="stepper-btn" data-step="1" aria-label="增加人數">+</button>
            </div>
            <button id="batch-start" class="btn btn-primary" type="button">批次抽 <span id="batch-n">3</span> 人</button>
          </div>
        </div>

        <div id="batch-tray" class="batch-tray" hidden>
          <div class="batch-tray-head">
            <span class="batch-progress">批次抽獎 <b class="batch-done">0</b> / <b class="batch-total">0</b></span>
            <button id="batch-stop" class="btn btn-ghost btn-sm btn-danger" type="button">停止</button>
          </div>
          <ol class="batch-tray-list" tabindex="0" aria-label="本批得獎者"></ol>
        </div>
      </section>

      <section class="panel panel-history" aria-labelledby="history-heading">
        <div class="panel-head">
          <h2 id="history-heading" class="panel-title">得獎紀錄</h2>
          <div class="panel-actions">
          <button id="clear-history" class="btn btn-ghost btn-sm btn-danger" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
            清除
          </button>
          <button id="export-results" class="btn btn-ghost btn-sm" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4 17v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/></svg>
            匯出結果
          </button>
          </div>
        </div>
        <ol id="history-list" class="history-list" reversed tabindex="0" aria-label="得獎紀錄列表"></ol>
        <p id="history-empty" class="empty-state">尚無紀錄</p>
      </section>
    </main>

    <div id="announcer" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

    <footer class="site-footer">
      <p>GDG on Campus NTUST</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
